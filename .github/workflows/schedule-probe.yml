name: Temporary Schedule Probe

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record scheduled trigger
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "scheduled_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
